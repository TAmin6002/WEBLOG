version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: weblog_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d weblog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: go_weblog_app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_CONN=postgres://user:password@db:5432/weblog_db?sslmode=disable
    volumes:
      - uploads_data:/root/uploads
    restart: always

volumes:
  pgdata:
  uploads_data:
